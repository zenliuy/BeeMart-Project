<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6ef">
    <title>Sign in | BeeMart</title>
    <link rel="stylesheet" href="../css/pages/authentication.css">
    <script src="../js/pages/authentication.js" defer></script>
</head>

<body class="auth-page">
    <!-- Authentication Screen -->
    <main id="auth-screen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-brand">
                <div class="auth-logo" aria-hidden="true">B</div>
                <div>
                    <h1>BeeMart</h1>
                    <p>A little goodness in every find.</p>
                </div>
            </div>

            <h2 class="auth-heading">Welcome back</h2>
            <p class="auth-subheading">Sign in to continue to your account.</p>

            <div class="auth-tabs">
                <button id="auth-tab-login" class="auth-tab-button active" type="button" aria-pressed="true" onclick="showLoginForm()">Log in</button>
                <button id="auth-tab-register" class="auth-tab-button" type="button" aria-pressed="false" onclick="showRegisterForm()">Create account</button>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" placeholder="you@example.com" class="form-control" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" placeholder="Password" class="form-control" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="login-roles">Role</label>
                    <select id="login-roles" class="form-control">
                        <option value="" disabled selected>Choose role</option>
                        <option value="Admin">Admin</option>
                        <option value="Kasir">Kasir</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="login()">Log in</button>
                <div id="login-error" class="message-error"></div>
            </form>

            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" placeholder="you@example.com" class="form-control" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input id="register-password" type="password" placeholder="At least 6 characters" class="form-control" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Konfirmasi Password</label>
                    <input id="register-confirm-password" type="password" placeholder="Enter your password again" class="form-control" autocomplete="new-password">
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="createAccount()">Create account</button>
                <div id="register-error" class="message-error"></div>
            </form>
        </div>
    </main>

    </body>
</html>
